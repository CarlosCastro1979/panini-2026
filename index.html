<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panini 2026">
<meta name="theme-color" content="#0b0e18">
<link rel="manifest" href="manifest.json">
<title>Panini FIFA World Cup 2026™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #0b0e18;
  --bg2:    #121729;
  --bg3:    #1a2035;
  --card:   #151b2e;
  --gold:   #d4a843;
  --gold2:  #f0c95a;
  --green:  #34d399;
  --red:    #f43f5e;
  --blue:   #60a5fa;
  --orange: #fb923c;
  --text:   #e8e8f0;
  --text2:  #8891a8;
  --border: rgba(255,255,255,0.06);
  --radius: 12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Source Sans 3',sans-serif}
body{display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
h1,h2,h3,.stat-num,.nav-label,.team-count,.section-title{font-family:'Oswald',sans-serif}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
input::placeholder{color:#555}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit}
button:active{transform:scale(0.96)}

/* ── SCREENS ── */
.screen{display:none;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.screen.active{display:flex}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:72px}

/* ── SPLASH ── */
#splash{align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at 50% 30%,#1a2040,#0b0e18)}
.splash-icon{font-size:64px;animation:float 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.splash-title{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;color:var(--gold);letter-spacing:4px;text-transform:uppercase}
.splash-dots{display:flex;gap:6px;margin-top:8px}
.splash-dots span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 1s ease-in-out infinite}
.splash-dots span:nth-child(2){animation-delay:.2s}
.splash-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

/* ── COLLECTIONS SCREEN ── */
.coll-header{padding:20px 16px;text-align:center;border-bottom:1px solid var(--border)}
.coll-header h1{font-size:20px;font-weight:700;color:var(--gold);letter-spacing:3px;text-transform:uppercase}
.coll-header p{font-size:11px;color:var(--text2);margin-top:4px;letter-spacing:1px}
.coll-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;margin:6px 14px}
.coll-card:first-of-type{margin-top:14px}
.coll-avatar{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#1e2a45,#162035);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.coll-info{flex:1;min-width:0}
.coll-name{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;color:var(--text)}
.coll-stats{font-size:11px;color:var(--text2);margin-top:2px}
.coll-progress{height:4px;background:#1a2035;border-radius:2px;margin-top:6px;overflow:hidden}
.coll-progress-bar{height:100%;border-radius:2px;background:var(--gold);transition:width .4s}
.coll-arrow{color:#444;font-size:16px}
.btn-new-coll{margin:16px;padding:14px;border-radius:var(--radius);background:linear-gradient(135deg,var(--gold),#c49530);color:#000;font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;text-align:center}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:340px}
.modal h3{font-size:18px;font-weight:600;color:var(--gold);margin-bottom:16px;text-align:center}
.modal-input{width:100%;padding:12px;background:var(--bg);border:1px solid #333;border-radius:8px;color:var(--text);font-size:15px;margin-bottom:12px;text-align:center;outline:none}
.modal-input:focus{border-color:var(--gold)}
.pin-dots{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.pin-dot{width:36px;height:42px;border-radius:8px;background:var(--bg);border:2px solid #333;font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;color:var(--gold);text-align:center;outline:none}
.pin-dot:focus{border-color:var(--gold)}
.modal-btn{width:100%;padding:12px;border-radius:8px;font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:8px}
.modal-btn.primary{background:var(--gold);color:#000}
.modal-btn.secondary{background:#1a2035;color:var(--text2)}
.modal-btn.danger{background:#3a1520;color:var(--red)}

/* ── MAIN APP HEADER ── */
.app-header{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--bg)}
.app-header .back-btn{font-size:18px;color:var(--gold);padding:4px}
.app-header h2{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;flex:1}
.app-header .edit-btn{font-size:13px;color:var(--text2);padding:4px 8px}

/* ── STATS BAR ── */
.stats-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;gap:6px}
.stat-item{flex:1;text-align:center}
.stat-num{font-size:22px;font-weight:700}
.stat-num.owned{color:var(--green)}
.stat-num.missing{color:var(--red)}
.stat-num.dupes{color:var(--orange)}
.stat-label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.stats-progress{padding:0 16px 12px;background:var(--bg2)}
.progress-track{height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;transition:width .5s}
.pct-label{text-align:right;font-family:'Oswald',sans-serif;font-size:11px;color:var(--gold);margin-top:4px}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:60px;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:50}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#444;transition:color .15s}
.nav-tab.active{color:var(--gold)}
.nav-tab .nav-icon{font-size:18px}
.nav-label{font-size:8px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}

/* ── TEAM LIST ── */
.team-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);transition:background .1s}
.team-row:active{background:var(--bg3)}
.team-flag{font-size:22px;width:32px;text-align:center}
.team-info{flex:1;min-width:0}
.team-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-prog{height:3px;background:var(--bg);border-radius:2px;margin-top:4px;overflow:hidden}
.team-prog-bar{height:100%;border-radius:2px;background:var(--gold);transition:width .3s}
.team-count{font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap}
.team-complete .team-name{color:var(--green)}
.team-complete .team-prog-bar{background:var(--green)}
.team-complete .team-count{color:var(--green)}

/* ── STICKER LIST ── */
.sticker-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border)}
.sticker-check{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .15s}
.sticker-check.off{background:#1a2035;color:transparent}
.sticker-check.on{background:var(--green);color:#fff}
.sticker-id{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:.5px;min-width:48px}
.sticker-id.foil{color:var(--gold)}
.sticker-id.normal{color:#6670a0}
.foil-badge{font-size:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;padding:1px 4px;border-radius:3px;font-weight:700;letter-spacing:.5px;margin-left:4px}
.sticker-name{flex:1;font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sticker-name.owned{color:#ccc}
.sticker-team-flag{font-size:12px}
.qty-controls{display:flex;align-items:center;gap:3px;flex-shrink:0}
.qty-btn{width:24px;height:24px;border-radius:6px;font-size:14px;display:flex;align-items:center;justify-content:center}
.qty-btn.minus{background:#2a1520;color:var(--red)}
.qty-btn.plus{background:#152030;color:var(--blue)}
.qty-num{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;min-width:18px;text-align:center}
.qty-num.dupe{color:var(--orange)}
.qty-num.single{color:#888}

/* ── SEARCH ── */
.search-bar{padding:12px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.search-input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid #2a2a40;border-radius:8px;color:var(--text);font-size:14px;outline:none}
.search-input:focus{border-color:var(--gold)}

/* ── TRADES ── */
.trade-section{padding:14px}
.trade-section h3{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.trade-match{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.trade-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.trade-user{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;color:var(--gold)}
.trade-badge{font-size:10px;background:#1a2a1a;color:var(--green);padding:2px 8px;border-radius:4px;font-weight:600}
.trade-row{display:flex;gap:6px;flex-wrap:wrap}
.trade-chip{font-size:11px;background:var(--bg);padding:3px 8px;border-radius:4px;color:var(--text2)}
.trade-chip.give{border-left:2px solid var(--red)}
.trade-chip.get{border-left:2px solid var(--green)}
.trade-divider{text-align:center;color:#444;font-size:11px;padding:4px 0}

/* ── SECTION HEADERS ── */
.section-header{padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.section-title{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:2px;text-transform:uppercase}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:48px 20px;color:#555}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:13px}

/* ── PAGE GROUPS ── */
.page-group{margin-bottom:2px}
.page-header{padding:6px 14px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.page-title{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase}
.page-count{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;color:var(--text2)}
</style>
</head>
<body>

<!-- ══════ SPLASH ══════ -->
<div id="splash" class="screen active">
  <div class="splash-icon">⚽</div>
  <div class="splash-title">World Cup 2026</div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
</div>

<!-- ══════ COLLECTIONS LIST ══════ -->
<div id="screen-collections" class="screen">
  <div class="coll-header">
    <div style="font-size:32px;margin-bottom:6px">⚽</div>
    <h1>Panini World Cup 2026</h1>
    <p>Coleções</p>
  </div>
  <div class="scroll-area" id="coll-list"></div>
  <button class="btn-new-coll" onclick="showNewCollModal()">+ Nova Coleção</button>
</div>

<!-- ══════ MAIN APP (inside a collection) ══════ -->
<div id="screen-app" class="screen">
  <!-- Header -->
  <div class="app-header">
    <button class="back-btn" onclick="goToCollections()">←</button>
    <h2 id="app-title">Coleção</h2>
    <button class="edit-btn" onclick="showEditCollModal()">⚙</button>
  </div>
  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-item"><div class="stat-num owned" id="stat-owned">0</div><div class="stat-label">Tenho</div></div>
    <div class="stat-item"><div class="stat-num missing" id="stat-missing">0</div><div class="stat-label">Faltam</div></div>
    <div class="stat-item"><div class="stat-num dupes" id="stat-dupes">0</div><div class="stat-label">Repetidos</div></div>
  </div>
  <div class="stats-progress">
    <div class="progress-track"><div class="progress-fill" id="stat-progress"></div></div>
    <div class="pct-label" id="stat-pct">0%</div>
  </div>
  <!-- Tab content -->
  <div class="scroll-area" id="app-content"></div>
  <!-- Bottom nav -->
  <div class="bottom-nav">
    <button class="nav-tab active" data-tab="teams" onclick="switchTab('teams')">
      <span class="nav-icon">🏠</span><span class="nav-label">Equipas</span>
    </button>
    <button class="nav-tab" data-tab="missing" onclick="switchTab('missing')">
      <span class="nav-icon">❌</span><span class="nav-label">Faltam</span>
    </button>
    <button class="nav-tab" data-tab="dupes" onclick="switchTab('dupes')">
      <span class="nav-icon">🔄</span><span class="nav-label">Repetidos</span>
    </button>
    <button class="nav-tab" data-tab="trades" onclick="switchTab('trades')">
      <span class="nav-icon">🤝</span><span class="nav-label">Trocas</span>
    </button>
    <button class="nav-tab" data-tab="search" onclick="switchTab('search')">
      <span class="nav-icon">🔍</span><span class="nav-label">Procurar</span>
    </button>
  </div>
</div>

<!-- ══════ TEAM DETAIL ══════ -->
<div id="screen-team" class="screen">
  <div class="app-header">
    <button class="back-btn" onclick="goBackFromTeam()">←</button>
    <span id="team-flag" style="font-size:24px"></span>
    <h2 id="team-title" style="flex:1"></h2>
    <span id="team-detail-count" class="team-count"></span>
  </div>
  <div class="scroll-area" id="team-stickers"></div>
  <div class="bottom-nav">
    <button class="nav-tab active" data-tab="teams" onclick="switchTab('teams')">
      <span class="nav-icon">🏠</span><span class="nav-label">Equipas</span>
    </button>
    <button class="nav-tab" data-tab="missing" onclick="switchTab('missing')">
      <span class="nav-icon">❌</span><span class="nav-label">Faltam</span>
    </button>
    <button class="nav-tab" data-tab="dupes" onclick="switchTab('dupes')">
      <span class="nav-icon">🔄</span><span class="nav-label">Repetidos</span>
    </button>
    <button class="nav-tab" data-tab="trades" onclick="switchTab('trades')">
      <span class="nav-icon">🤝</span><span class="nav-label">Trocas</span>
    </button>
    <button class="nav-tab" data-tab="search" onclick="switchTab('search')">
      <span class="nav-icon">🔍</span><span class="nav-label">Procurar</span>
    </button>
  </div>
</div>

<!-- ══════ MODALS ══════ -->
<div id="modal-new-coll" class="modal-overlay">
  <div class="modal">
    <h3>Nova Coleção</h3>
    <input class="modal-input" id="new-coll-name" placeholder="Nome (ex: Santiago)" maxlength="30">
    <p style="font-size:11px;color:var(--text2);text-align:center;margin-bottom:8px">PIN de 4 dígitos para editar</p>
    <div class="pin-dots">
      <input class="pin-dot" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="pin-dot" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="pin-dot" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="pin-dot" maxlength="1" inputmode="numeric" pattern="[0-9]">
    </div>
    <button class="modal-btn primary" onclick="createCollection()">Criar</button>
    <button class="modal-btn secondary" onclick="closeModals()">Cancelar</button>
  </div>
</div>

<div id="modal-pin" class="modal-overlay">
  <div class="modal">
    <h3 id="pin-modal-title">Introduzir PIN</h3>
    <p style="font-size:11px;color:var(--text2);text-align:center;margin-bottom:12px" id="pin-modal-sub">PIN de 4 dígitos para editar</p>
    <div class="pin-dots" id="pin-entry">
      <input class="pin-dot" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="pin-dot" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="pin-dot" maxlength="1" inputmode="numeric" pattern="[0-9]">
      <input class="pin-dot" maxlength="1" inputmode="numeric" pattern="[0-9]">
    </div>
    <p id="pin-error" style="font-size:12px;color:var(--red);text-align:center;display:none">PIN incorreto</p>
    <button class="modal-btn primary" onclick="submitPin()">Confirmar</button>
    <button class="modal-btn secondary" onclick="closeModals()">Cancelar</button>
  </div>
</div>

<div id="modal-edit-coll" class="modal-overlay">
  <div class="modal">
    <h3>Editar Coleção</h3>
    <input class="modal-input" id="edit-coll-name" placeholder="Nome da coleção" maxlength="30">
    <button class="modal-btn primary" onclick="saveCollEdit()">Guardar</button>
    <button class="modal-btn danger" onclick="confirmDeleteColl()">Apagar Coleção</button>
    <button class="modal-btn secondary" onclick="closeModals()">Cancelar</button>
  </div>
</div>

<div id="modal-confirm-delete" class="modal-overlay">
  <div class="modal">
    <h3>Apagar Coleção?</h3>
    <p style="font-size:13px;color:var(--text2);text-align:center;margin-bottom:16px">Esta ação não pode ser revertida.</p>
    <button class="modal-btn danger" onclick="deleteCollection()">Sim, Apagar</button>
    <button class="modal-btn secondary" onclick="closeModals()">Cancelar</button>
  </div>
</div>
<script>
// ═══════════════════════════════════════════════════════════════════════════════
// SUPABASE CONFIG
// ═══════════════════════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://ksvvpuezzkebvtzjdlfs.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzdnZwdWV6emtlYnZ0empkbGZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyODEwMTQsImV4cCI6MjA5Mzg1NzAxNH0.iVxBlZo7aCT7tpJs13F2Zct97eTdMZ5QZfEnZBrq7sc';

async function sbFetch(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || '',
      ...opts.headers,
    },
  });
  if (opts.method === 'DELETE') return null;
  return res.json();
}

const sb = {
  async getColecoes() {
    return sbFetch('colecoes?order=criado_em.asc');
  },
  async insertColecao(nome, pin_hash) {
    return sbFetch('colecoes', {
      method: 'POST', prefer: 'return=representation',
      body: JSON.stringify({ nome, pin_hash }),
    });
  },
  async updateColecao(id, data) {
    return sbFetch(`colecoes?id=eq.${id}`, {
      method: 'PATCH', prefer: 'return=representation',
      body: JSON.stringify(data),
    });
  },
  async deleteColecao(id) {
    await sbFetch(`cromos?colecao_id=eq.${id}`, { method: 'DELETE' });
    await sbFetch(`colecoes?id=eq.${id}`, { method: 'DELETE' });
  },
  async getAllCromos() {
    return sbFetch('cromos?select=colecao_id,cromo_id,quantidade');
  },
  async upsertCromo(colecaoId, cromoId, quantidade) {
    const existing = await sbFetch(`cromos?colecao_id=eq.${colecaoId}&cromo_id=eq.${cromoId}&select=id`);
    if (Array.isArray(existing) && existing.length > 0) {
      if (quantidade <= 0) {
        await sbFetch(`cromos?colecao_id=eq.${colecaoId}&cromo_id=eq.${cromoId}`, { method: 'DELETE' });
      } else {
        await sbFetch(`cromos?colecao_id=eq.${colecaoId}&cromo_id=eq.${cromoId}`, {
          method: 'PATCH', prefer: 'return=representation',
          body: JSON.stringify({ quantidade, atualizado_em: new Date().toISOString() }),
        });
      }
    } else if (quantidade > 0) {
      await sbFetch('cromos', {
        method: 'POST', prefer: 'return=representation',

let collections = [];

let currentTab = 'teams';
let editUnlocked = false;
let pendingPinAction = null;
let pendingCollIndex = null;

function hashPin(pin) {
  let h = 0;
  for (let i = 0; i < pin.length; i++) { h = ((h << 5) - h) + pin.charCodeAt(i); h |= 0; }
  return 'ph_' + Math.abs(h).toString(36);
}

async function loadCollections() {
  try {
    const cols = await sb.getColecoes();
    if (!Array.isArray(cols)) throw new Error('Bad response');
    const allCromos = await sb.getAllCromos();
    const cromosByCol = {};
    if (Array.isArray(allCromos)) {
      allCromos.forEach(c => {
        if (!cromosByCol[c.colecao_id]) cromosByCol[c.colecao_id] = {};
        cromosByCol[c.colecao_id][c.cromo_id] = c.quantidade;
      });
    }
    collections = cols.map(c => ({
      id: c.id, nome: c.nome, pin_hash: c.pin_hash,
      stickers: cromosByCol[c.id] || {}, criado_em: c.criado_em,
    }));
  } catch(e) {
    console.error('Load error:', e);
    try { const raw = localStorage.getItem('panini2026'); if (raw) collections = JSON.parse(raw); } catch {}
  }
}

function saveLocal() { localStorage.setItem('panini2026', JSON.stringify(collections)); }

let saveQueue = [];
let saveTimer = null;
function queueSave(colecaoId, cromoId, quantidade) {
  saveQueue.push({ colecaoId, cromoId, quantidade });
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSaves, 600);
}
async function flushSaves() {
  const batch = [...saveQueue]; saveQueue = [];
  for (const { colecaoId, cromoId, quantidade } of batch) {
    try { await sb.upsertCromo(colecaoId, cromoId, quantidade); } catch(e) { console.error(e); }
  }
  saveLocal();
}

<script>

// SCREEN MANAGEMENT

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setupPinInputs(container) {
  const dots = container.querySelectorAll('.pin-dot');
  dots.forEach((d, i) => {
    d.value = '';
    d.addEventListener('input', () => {
      d.value = d.value.replace(/[^0-9]/g, '');
      if (d.value && i < 3) dots[i + 1].focus();
    });
    d.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !d.value && i > 0) dots[i - 1].focus();
    });
  });
  setTimeout(() => dots[0].focus(), 100);
}

function getPinFromContainer(container) {
  return Array.from(container.querySelectorAll('.pin-dot')).map(d => d.value).join('');
}

function closeModals() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
}

function showNewCollModal() {
  const modal = document.getElementById('modal-new-coll');
  modal.classList.add('active');
  document.getElementById('new-coll-name').value = '';
  setupPinInputs(modal);
}

function showEditCollModal() {

  document.getElementById('pin-error').style.display = 'none';
  modal.classList.add('active');
  setupPinInputs(document.getElementById('pin-entry'));
}

function submitPin() {
  const pin = getPinFromContainer(document.getElementById('pin-entry'));
  if (pin.length !== 4) return;
  const idx = pendingPinAction === 'open' ? pendingCollIndex : currentColl;
  const coll = collections[idx];
  if (hashPin(pin) !== coll.pin_hash) {
    document.getElementById('pin-error').style.display = 'block';
    setupPinInputs(document.getElementById('pin-entry'));
    return;
  }
  closeModals();
  editUnlocked = true;
  if (pendingPinAction === 'open') { currentColl = idx; openCollection(); }
  else if (pendingPinAction === 'edit') { showEditCollModal(); }
  else { refreshCurrentView(); }
}

async function createCollection() {
  const nome = document.getElementById('new-coll-name').value.trim();
  const modal = document.getElementById('modal-new-coll');
  const pin = getPinFromContainer(modal);
  if (!nome || pin.length !== 4) return;
  const pinHash = hashPin(pin);
  try {
    const result = await sb.insertColecao(nome, pinHash);
    if (Array.isArray(result) && result[0]) {
      collections.push({ id: result[0].id, nome, pin_hash: pinHash, stickers: {}, criado_em: result[0].criado_em });
    } else {
      collections.push({ id: Date.now().toString(), nome, pin_hash: pinHash, stickers: {}, criado_em: new Date().toISOString() });
    }
  } catch {
    collections.push({ id: Date.now().toString(), nome, pin_hash: pinHash, stickers: {}, criado_em: new Date().toISOString() });
  }
  saveLocal();
  closeModals();
  renderCollections();
}

async function saveCollEdit() {
  const nome = document.getElementById('edit-coll-name').value.trim();
  if (!nome) return;
  collections[currentColl].nome = nome;
  try { await sb.updateColecao(collections[currentColl].id, { nome }); } catch {}
  saveLocal();
  closeModals();
  document.getElementById('app-title').textContent = nome;
}

function confirmDeleteColl() {
  closeModals();
  document.getElementById('modal-confirm-delete').classList.add('active');
}

async function deleteCollection() {
  const id = collections[currentColl].id;
  collections.splice(currentColl, 1);
  try { await sb.deleteColecao(id); } catch {}
  saveLocal();
  currentColl = null; editUnlocked = false;
  closeModals();
  showScreen('screen-collections');
  renderCollections();
}

// ── COLLECTIONS LIST ─────────────────────────────────────────────────────────
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderCollections() {
  const list = document.getElementById('coll-list');
  if (collections.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Nenhuma coleção ainda.<br>Cria uma para começar!</p></div>';
    return;
  }
  list.innerHTML = collections.map((c, i) => {
    const owned = Object.keys(c.stickers).length;
    const pct = Math.round((owned / TOTAL) * 100);
    return `
      <div class="coll-card" onclick="requestOpenColl(${i})">
        <div class="coll-avatar">⚽</div>
        <div class="coll-info">
          <div class="coll-name">${esc(c.nome)}</div>
          <div class="coll-stats">${owned}/${TOTAL} cromos · ${pct}%</div>
          <div class="coll-progress"><div class="coll-progress-bar" style="width:${pct}%"></div></div>
        </div>
        <div class="coll-arrow">›</div>
      </div>`;
  }).join('');
}

function requestOpenColl(idx) {
  pendingCollIndex = idx;
  currentColl = idx;
  editUnlocked = false;
  openCollection();
}

function goToCollections() {
  currentColl = null; editUnlocked = false;
  showScreen('screen-collections');
  renderCollections();
}

function openCollection() {
  const coll = collections[currentColl];
  document.getElementById('app-title').textContent = coll.nome;
  currentTab = 'teams';
  showScreen('screen-app');
  updateStats();
  renderTab();
}

function updateStats() {
  const stickers = collections[currentColl].stickers;
  const owned = Object.keys(stickers).length;
  const dupes = Object.values(stickers).reduce((s, q) => s + Math.max(0, q - 1), 0);
  const missing = TOTAL - owned;
  const pct = Math.round((owned / TOTAL) * 100);
  document.getElementById('stat-owned').textContent = owned;
  document.getElementById('stat-missing').textContent = missing;
  document.getElementById('stat-dupes').textContent = dupes;
  document.getElementById('stat-progress').style.width = pct + '%';
  document.getElementById('stat-pct').textContent = pct + '%';
}

// ── TAB NAVIGATION ───────────────────────────────────────────────────────────
function switchTab(tab) {
  if (tab === 'teams' && document.getElementById('screen-team').classList.contains('active')) {
    showScreen('screen-app');
  }
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab !== 'teams' || !document.getElementById('screen-team').classList.contains('active')) {
    showScreen('screen-app');
  }
  renderTab();
}

function renderTab() {
  const content = document.getElementById('app-content');
  content.scrollTop = 0;
  switch (currentTab) {
    case 'teams': renderTeams(content); break;
    case 'missing': renderMissing(content); break;
    case 'dupes': renderDupes(content); break;
    case 'trades': renderTrades(content); break;
    case 'search': renderSearch(content); break;
  }
}

// ── TEAMS LIST ───────────────────────────────────────────────────────────────
function renderTeams(container) {
  const stickers = collections[currentColl].stickers;
  container.innerHTML = TEAM_LIST.map(t => {
    const teamStickers = ALL.filter(s => s.team === t.code);
    const owned = teamStickers.filter(s => stickers[s.id]).length;
    const total = teamStickers.length;
    const pct = total ? Math.round((owned / total) * 100) : 0;
    const complete = owned === total && total > 0;
    return `
      <div class="team-row ${complete ? 'team-complete' : ''}" onclick="openTeam('${t.code}')">
        <span class="team-flag">${t.flag}</span>
        <div class="team-info">
          <div class="team-name">${esc(t.name)}</div>
          <div class="team-prog"><div class="team-prog-bar" style="width:${pct}%"></div></div>
        </div>
        <span class="team-count">${owned}/${total}</span>
      </div>`;
  }).join('');
}

// ── TEAM DETAIL ──────────────────────────────────────────────────────────────
let currentTeamCode = null;

function openTeam(code) {
  currentTeamCode = code;
  const team = TEAM_LIST.find(t => t.code === code);
  if (!team) return;
  document.getElementById('team-flag').textContent = team.flag;
  document.getElementById('team-title').textContent = team.name;
  const teamStickers = ALL.filter(s => s.team === code);
  renderStickerList(document.getElementById('team-stickers'), teamStickers);
  const stk = collections[currentColl].stickers;
  const owned = teamStickers.filter(s => stk[s.id]).length;
  document.getElementById('team-detail-count').textContent = `${owned}/${teamStickers.length}`;
  showScreen('screen-team');
}

function goBackFromTeam() {
  currentTeamCode = null;
  showScreen('screen-app');
  renderTab();
}

// ── STICKER LIST ─────────────────────────────────────────────────────────────
function renderStickerList(container, stickers, showFlag = false) {
  const stk = collections[currentColl].stickers;
  container.innerHTML = stickers.map(s => {
    const qty = stk[s.id] || 0;
    const owned = qty > 0;
    return `
      <div class="sticker-row">
        <button class="sticker-check ${owned ? 'on' : 'off'}" onclick="toggleSticker('${s.id}')">
          ${owned ? '✓' : ''}
        </button>
        <span class="sticker-id ${s.foil ? 'foil' : 'normal'}">${s.id}${s.foil ? '<span class="foil-badge">FOIL</span>' : ''}</span>
        <span class="sticker-name ${owned ? 'owned' : ''}">${esc(s.name)}</span>
        ${showFlag ? `<span class="sticker-team-flag">${s.flag}</span>` : ''}
        ${owned ? `
          <div class="qty-controls">
            <button class="qty-btn minus" onclick="event.stopPropagation();adjustQty('${s.id}',-1)">−</button>
            <span class="qty-num ${qty > 1 ? 'dupe' : 'single'}">${qty}</span>
            <button class="qty-btn plus" onclick="event.stopPropagation();adjustQty('${s.id}',1)">+</button>
          </div>
        ` : ''}
      </div>`;
  }).join('');
}

// ── MISSING ──────────────────────────────────────────────────────────────────
function renderMissing(container) {
  const stk = collections[currentColl].stickers;
  const missing = ALL.filter(s => !stk[s.id]);
  if (missing.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🏆</div><p>Coleção completa! Parabéns!</p></div>';
    return;
  }
  let html = '', lastTeam = '';
  missing.forEach(s => {
    if (s.team !== lastTeam) {
      const team = TEAM_LIST.find(t => t.code === s.team) || {name: s.team, flag: ''};
      const teamMissing = missing.filter(x => x.team === s.team).length;
      html += `<div class="page-header"><span class="page-title">${team.flag} ${esc(team.name)}</span><span class="page-count">${teamMissing} em falta</span></div>`;
      lastTeam = s.team;
    }
    html += `<div class="sticker-row"><button class="sticker-check off" onclick="toggleSticker('${s.id}')"></button><span class="sticker-id ${s.foil ? 'foil' : 'normal'}">${s.id}${s.foil ? '<span class="foil-badge">FOIL</span>' : ''}</span><span class="sticker-name">${esc(s.name)}</span></div>`;
  });
  container.innerHTML = html;
}

// ── DUPES ────────────────────────────────────────────────────────────────────
function renderDupes(container) {
  const stk = collections[currentColl].stickers;
  const dupes = ALL.filter(s => (stk[s.id] || 0) > 1);
  if (dupes.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>Sem cromos repetidos.</p></div>';
    return;
  }
  const totalDupes = dupes.reduce((s, d) => s + stk[d.id] - 1, 0);
  let html = `<div class="page-header"><span class="page-title">🔄 Repetidos</span><span class="page-count">${totalDupes} extra</span></div>`;
  dupes.forEach(s => {
    const qty = stk[s.id];
    html += `<div class="sticker-row"><button class="sticker-check on" onclick="toggleSticker('${s.id}')">✓</button><span class="sticker-id ${s.foil ? 'foil' : 'normal'}">${s.id}</span><span class="sticker-name owned">${esc(s.name)}</span><span class="sticker-team-flag">${s.flag}</span><div class="qty-controls"><button class="qty-btn minus" onclick="event.stopPropagation();adjustQty('${s.id}',-1)">−</button><span class="qty-num dupe">${qty}</span><button class="qty-btn plus" onclick="event.stopPropagation();adjustQty('${s.id}',1)">+</button></div></div>`;
  });
  container.innerHTML = html;
}

// ── SEARCH ───────────────────────────────────────────────────────────────────
function renderSearch(container) {
  container.innerHTML = `<div class="search-bar"><input class="search-input" id="search-input" placeholder="Nome, número ou equipa..." oninput="doSearch()" autofocus></div><div id="search-results"><div class="empty-state"><div class="icon">🔍</div><p>Escreve para procurar...</p></div></div>`;
  setTimeout(() => document.getElementById('search-input')?.focus(), 100);
}

function doSearch() {
  const q = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
  const results = document.getElementById('search-results');
  if (!q) { results.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Escreve para procurar...</p></div>'; return; }
  const matches = ALL.filter(s =>
    s.id.toLowerCase().includes(q) || s.name.toLowerCase().includes(q) ||
    (TEAM_LIST.find(t => t.code === s.team)?.name || '').toLowerCase().includes(q)
  );
  if (matches.length === 0) { results.innerHTML = `<div class="empty-state"><div class="icon">🤷</div><p>Nenhum resultado para "${esc(q)}"</p></div>`; return; }
  renderStickerList(results, matches, true);
}

// ── TRADES ───────────────────────────────────────────────────────────────────
function renderTrades(container) {
  if (collections.length < 2) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🤝</div><p>Precisa de pelo menos 2 coleções para encontrar trocas.</p></div>';
    return;
  }
  const me = collections[currentColl];
  const myStk = me.stickers;
  const myDupeIds = new Set(ALL.filter(s => (myStk[s.id] || 0) > 1).map(s => s.id));
  const myMissingIds = new Set(ALL.filter(s => !myStk[s.id]).map(s => s.id));

  let html = '<div class="trade-section"><h3>🤝 Trocas possíveis</h3>';
  let hasMatches = false;

  collections.forEach((other, i) => {
    if (i === currentColl) return;
    const otherStk = other.stickers;
    const theyGiveIGet = ALL.filter(s => (otherStk[s.id] || 0) > 1 && myMissingIds.has(s.id));
    const iGiveTheyGet = ALL.filter(s => myDupeIds.has(s.id) && !otherStk[s.id]);
    if (theyGiveIGet.length === 0 && iGiveTheyGet.length === 0) return;
    hasMatches = true;
    const matchCount = Math.min(theyGiveIGet.length, iGiveTheyGet.length);
    html += `<div class="trade-match"><div class="trade-header"><span class="trade-user">⚽ ${esc(other.nome)}</span><span class="trade-badge">${matchCount} troca${matchCount !== 1 ? 's' : ''}</span></div>`;
    if (iGiveTheyGet.length > 0) {
      html += `<div style="font-size:10px;color:var(--red);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;font-weight:600">Eu dou (${iGiveTheyGet.length})</div><div class="trade-row">${iGiveTheyGet.slice(0,20).map(s=>`<span class="trade-chip give">${s.id}</span>`).join('')}${iGiveTheyGet.length>20?`<span class="trade-chip give">+${iGiveTheyGet.length-20}</span>`:''}</div>`;
    }
    html += '<div class="trade-divider">↕</div>';
    if (theyGiveIGet.length > 0) {
      html += `<div style="font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;font-weight:600">Eu recebo (${theyGiveIGet.length})</div><div class="trade-row">${theyGiveIGet.slice(0,20).map(s=>`<span class="trade-chip get">${s.id}</span>`).join('')}${theyGiveIGet.length>20?`<span class="trade-chip get">+${theyGiveIGet.length-20}</span>`:''}</div>`;
    }
    html += '</div>';
  });

  if (!hasMatches) html += '<div class="empty-state"><div class="icon">🤷</div><p>Nenhuma troca possível de momento.</p></div>';
  html += '</div>';
  container.innerHTML = html;
}

// ── STICKER TOGGLE / QTY ─────────────────────────────────────────────────────
function toggleSticker(id) {
  if (!editUnlocked) {
    pendingPinAction = 'toggle';
    showPinModal('Editar Cromos', 'PIN de 4 dígitos para editar');
    return;
  }
  const stk = collections[currentColl].stickers;
  if (stk[id]) { delete stk[id]; queueSave(collections[currentColl].id, id, 0); }
  else { stk[id] = 1; queueSave(collections[currentColl].id, id, 1); }
  refreshCurrentView();
}

function adjustQty(id, delta) {
  if (!editUnlocked) {
    pendingPinAction = 'toggle';
    showPinModal('Editar Cromos', 'PIN de 4 dígitos para editar');
    return;
  }
  const stk = collections[currentColl].stickers;
  const nv = (stk[id] || 0) + delta;
  if (nv <= 0) delete stk[id]; else stk[id] = nv;
  queueSave(collections[currentColl].id, id, Math.max(0, nv));
  refreshCurrentView();
}

function refreshCurrentView() {
  updateStats();
  if (document.getElementById('screen-team').classList.contains('active') && currentTeamCode) {
    openTeam(currentTeamCode);
  } else {
    renderTab();
  }
}

// ═══════════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════════
async function init() {
  showScreen('splash');
  await loadCollections();
  setTimeout(() => { showScreen('screen-collections'); renderCollections(); }, 1200);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

init();
</script>
